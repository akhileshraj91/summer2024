---
- name: Provisioning a node
  hosts: main_nodes,worker_nodes,libnrm
  gather_facts: false
  become: True


  tasks:
  - name: Install base packages
    become: yes
    ansible.builtin.apt:
      update_cache: yes
      pkg:
        - python3
        - python3-pip
        - apt-transport-https
        - curl
        - net-tools

  - name: Overlay-upgrade pip from PyPI (bypass PEP 668; skip uninstall)
    become: yes
    ansible.builtin.pip:
      name: "pip==25.2"                 # or use state: latest if you want the newest available
      state: present
      extra_args: "--break-system-packages --ignore-installed"
      executable: /usr/bin/pip3
    environment:
      PIP_ROOT_USER_ACTION: ignore



  - name: Update the pip list
    become: yes
    ansible.builtin.pip:
      name:
        - numpy
        - matplotlib
        - pandas
        - ruamel.yaml
        - IPython
        - torch
        - gym
      extra_args: "--break-system-packages --ignore-installed"
      executable: /usr/bin/pip3

  - name: Add the geopm PPA repository
    apt_repository:
      repo: 'ppa:geopm/release'
      state: present
      codename: noble

  - name: Install apt dependencies
    ansible.builtin.apt:
      update_cache: yes
      name:
        - libc6
        - libstdc++6
        - python3-cffi
        - python3-psutil
        - python3-setuptools
        - gcc
        - make
        - autoconf
        - automake
        - libtool
        - pkg-config
        - libzmq3-dev
        - libzmq5
        - libczmq-dev
        - libczmq4
        - libprotobuf-c-dev
        - protobuf-c-compiler
        - libjansson-dev
        - libjansson4
        - check
        - libhwloc-dev
        - libpapi-dev
        - mpich
        - libomp-dev
        - libomp5
        - libopenblas-dev
        # - geopm-service
        # - geopm-doc
        - libgeopmd-dev
        - geopmd
        # - libopenblas
        # - libgeopm
        # - libgeopmd-dev
        # - libgeopmd2
        # - python3-geopmdpy
        - geopm-cli
        - geopmd 
        - geopmd-cli 
        - geopmd-doc 
        - libgeopm-dev 
        - libgeopm-doc
        - libgeopm2 
        - libgeopmd-dev 
        - libgeopmd-doc 
        - libgeopmd2
        - python3-geopmdpy 
        - python3-geopmpy-doc
        - libblas-dev
      state: present
      update_cache: yes


  - name: Create directory for dependencies
    when: ansible_user is defined
    become: false
    ansible.builtin.file:
      path: ~{{ ansible_user }}/dependencies
      state: directory
      owner: "{{ ansible_user }}"
      mode: "u=rwx,g=rx,o="

  - name: Clone bats
    ansible.builtin.git:
      repo: 'https://github.com/bats-core/bats-core.git'
      dest: ~{{ ansible_user }}/dependencies/bats
      version: v1.9.0

  - name: Clone libnrm
    ansible.builtin.git:
      repo: 'https://github.com/anlsys/libnrm.git'
      dest: ~{{ ansible_user }}/dependencies/libnrm
      version: feature/geopm-freq
  
  - name: Install bats
    ansible.builtin.shell: |
      cd ~{{ ansible_user }}/dependencies/bats
      ./install.sh /usr

  - name: Install libnrm
    become: yes
    ansible.builtin.shell: |
      cd ~{{ ansible_user }}/dependencies/libnrm
      ./autogen.sh
      ./configure --prefix=/usr --with-python --with-geopm
      make -j
      make install
      
  - name: Create systemd service unit file for nrmd
    ansible.builtin.copy:
      dest: /etc/systemd/system/nrmd.service
      content: |
        [Unit]
        Description=NRMD Service

        [Service]
        Type=simple
        ExecStart=/usr/bin/nrmd
        Restart=always
        User=root
        StandardOutput=journal
        StandardError=journal

        [Install]
        WantedBy=multi-user.target

  - name: Create systemd service unit file for nrm-geopm
    ansible.builtin.copy:
      dest: /etc/systemd/system/nrm-geopm.service
      content: |
        [Unit]
        Description=NRMD Service

        [Service]
        Type=simple
        
        ExecStart=/usr/bin/nrm-geopm -e CPU_ENERGY -e CPU_POWER
        Restart=always
        User=root
        StandardOutput=journal
        StandardError=journal

        [Install]
        WantedBy=multi-user.target

  - name: Reload systemd to recognize the new service
    ansible.builtin.command: systemctl daemon-reload

  - name: Start nrmd service
    ansible.builtin.systemd:
      name: nrmd
      state: started

  - name: Provision geopm
    ansible.builtin.shell: |
      sudo modprobe msr
      sudo systemctl restart geopm.service 
      echo "CPU_POWER_LIMIT_CONTROL" > /tmp/ouraccess
      sudo geopmaccess -a > /tmp/allaccess
      sudo geopmaccess -a -c > /tmp/controlaccess
      echo "CPU_POWER_LIMIT_CONTROL" | sudo geopmaccess -w -c
      sudo geopmaccess -w -c < /tmp/ouraccess
      sudo geopmaccess -w < /tmp/ouraccess
      sudo geopmaccess -w < /tmp/allaccess
      sudo geopmaccess -w -c < /tmp/allaccess
      sudo geopmaccess -w < /tmp/controlaccess
      sudo geopmaccess -w -c < /tmp/controlaccess
      sudo systemctl restart nrmd.service
      sudo systemctl restart geopm.service
      sudo sysctl kernel.perf_event_paranoid=-1


  - name: Start nrm-geopm service
    ansible.builtin.systemd:
      name: nrm-geopm
      state: started

  - name: Configure PYTHONPATH for user
    ansible.builtin.lineinfile:
      path: ~{{ ansible_user }}/.bashrc
      regexp: '^export PYTHONPATH='
      line: 'export PYTHONPATH=/usr/lib/python3.12/site-packages:$PYTHONPATH # Added by ansible'
      state: present

  - name: Clone nrm-benchmarks
    ansible.builtin.git:
      repo: 'https://github.com/anlsys/nrm-benchmarks.git'
      dest: ~{{ ansible_user }}/dependencies/nrm-benchmarks

  - name: Install nrm-benchmarks
    become: yes
    ansible.builtin.shell: |
      sudo mkdir -p /usr/local/lib/pkgconfig
      sudo tee /usr/local/lib/pkgconfig/cblas.pc >/dev/null <<'EOF'
      prefix=/usr
      libdir=${prefix}/lib/x86_64-linux-gnu
      includedir=${prefix}/include

      Name: cblas
      Description: CBLAS interface provided by OpenBLAS
      Version: 0
      Libs: -lopenblas
      Cflags:
      EOF

      export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH}
      pkg-config --exists cblas && echo "cblas.pc available"

      cd ~{{ ansible_user }}/dependencies/nrm-benchmarks
      ./autogen.sh
      ./configure --disable-post-validation
      make -j
      make install  
